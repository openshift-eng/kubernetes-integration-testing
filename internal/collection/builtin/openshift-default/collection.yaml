apiVersion: kit.openshift.io/v1alpha1
kind: ResourceCollection
metadata:
  name: openshift-default
spec:
  source: openshift-default
  values:
    clusterProfile: self-managed-high-availability
  statusPatches:
    - kind: Infrastructure
      name: cluster
      status:
        platform: cluster.platform
        platformStatus:
          type: cluster.platform
        apiServerInternalURI: cluster.apiServerURL
    - kind: ClusterVersion
      name: version
      status:
        desired:
          image: cluster.image
          version: cluster.version
        observedGeneration: "0"
        versionHash: "''"
        availableUpdates: "[]"
    - kind: FeatureGate
      name: cluster
      status: >
        findReleaseByProfile(release, 'FeatureGate', 'cluster', cluster.featureSet, values.clusterProfile)
          .status.merge({
            'featureGates': findReleaseByProfile(release, 'FeatureGate', 'cluster', cluster.featureSet, values.clusterProfile)
              .status.featureGates.map(g, g.merge({'version': cluster.version}))
          })
