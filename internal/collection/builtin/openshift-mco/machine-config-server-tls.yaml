apiVersion: v1
kind: Secret
metadata:
  name: machine-config-server-tls
  namespace: openshift-machine-config-operator
type: kubernetes.io/tls
data:
  tls.crt: {{ signedCert .DefaultCA "machine-config-server.openshift-machine-config-operator.svc" | b64 }}
  tls.key: {{ signedKey .DefaultCA "machine-config-server.openshift-machine-config-operator.svc" | b64 }}
