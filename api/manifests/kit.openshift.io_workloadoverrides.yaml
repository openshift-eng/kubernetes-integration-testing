---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: workloadoverrides.kit.openshift.io
spec:
  group: kit.openshift.io
  names:
    kind: WorkloadOverride
    listKind: WorkloadOverrideList
    plural: workloadoverrides
    singular: workloadoverride
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              containers:
                description: |-
                  Containers declares per-container field overrides.
                  Each entry targets one existing container by name.
                items:
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      items:
                        type: string
                      type: array
                    env:
                      items:
                        properties:
                          name:
                            pattern: ^[-._a-zA-Z][-._a-zA-Z0-9]*$
                            type: string
                          remove:
                            type: boolean
                          value:
                            type: string
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of value or remove must be set
                          rule: has(self.value) != self.remove
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    image:
                      minLength: 1
                      type: string
                    name:
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    pullPolicy:
                      description: PullPolicy describes a policy for if/when to pull
                        a container image
                      enum:
                      - Always
                      - IfNotPresent
                      - Never
                      type: string
                    remove:
                      description: |-
                        Remove removes the named container from the pod.
                        Mutually exclusive with all other container fields.
                      type: boolean
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: remove is mutually exclusive with other container fields
                    rule: '!self.remove || (!has(self.image) && !has(self.pullPolicy)
                      && !has(self.command) && !has(self.args) && !has(self.env))'
                  - message: at least one override field must be set
                    rule: self.remove || has(self.image) || has(self.pullPolicy) ||
                      has(self.command) || has(self.args) || (has(self.env) && size(self.env)
                      > 0)
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              match:
                description: |-
                  Match selects the Pods affected by this override. The runtime selector is
                  evaluated against the admitted Pod object, not against its owning
                  Deployment, DaemonSet, Job, or Pod template.

                  All non-empty match fields must match the same Pod. A field that is absent
                  does not constrain the match, but at least one field must be non-empty.
                properties:
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels requires every key and value to be present on the Pod with the
                      same value. An empty map does not constrain labels and is not by itself
                      a valid match.
                    type: object
                  namespace:
                    description: |-
                      Namespace restricts the match to Pods in this namespace. An empty value
                      does not constrain the namespace.
                    type: string
                  nodeName:
                    description: |-
                      NodeName restricts the match to Pods assigned to this exact node. The
                      admission webhook observes Pods on CREATE, before the scheduler has
                      assigned a node to an ordinary Pod. This field is therefore most useful
                      for Pods created with an explicit node assignment, such as DaemonSet
                      Pods.
                    type: string
                  podName:
                    description: |-
                      PodName restricts the match to one exact Pod name. Generated Pod names
                      change on recreation, so labels are usually more stable for controller-
                      owned workloads.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: at least one non-empty match field must be set
                  rule: (has(self.namespace) && size(self.namespace) > 0) || (has(self.labels)
                    && size(self.labels) > 0) || (has(self.podName) && size(self.podName)
                    > 0) || (has(self.nodeName) && size(self.nodeName) > 0)
              noOp:
                description: NoOp suppresses execution of every container in matching
                  pods.
                type: boolean
            required:
            - match
            type: object
            x-kubernetes-validations:
            - message: noOp is mutually exclusive with containers
              rule: '!(self.noOp && has(self.containers) && size(self.containers)
                > 0)'
            - message: noOp or at least one container override must be set
              rule: self.noOp || (has(self.containers) && size(self.containers) >
                0)
          status:
            properties:
              appliedPods:
                description: |-
                  AppliedPods is the number of matched live Pods whose effective admitted
                  specification contains this override. It is a point-in-time observation.
                format: int32
                minimum: 0
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              matchedPods:
                description: |-
                  MatchedPods is the number of live Pods matching spec.match at the last
                  observation. It is a point-in-time observation, not the expected replica
                  count or the number of Pods that have ever matched.
                format: int32
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
