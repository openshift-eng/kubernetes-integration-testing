---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: workloadoverrides.kit.openshift.io
spec:
  group: kit.openshift.io
  names:
    kind: WorkloadOverride
    listKind: WorkloadOverrideList
    plural: workloadoverrides
    singular: workloadoverride
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              containers:
                description: |-
                  Containers declares per-container field overrides.
                  Each entry targets one existing container by name.
                items:
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      items:
                        type: string
                      type: array
                    env:
                      items:
                        properties:
                          name:
                            pattern: ^[-._a-zA-Z][-._a-zA-Z0-9]*$
                            type: string
                          remove:
                            type: boolean
                          value:
                            type: string
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of value or remove must be set
                          rule: has(self.value) != self.remove
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    image:
                      minLength: 1
                      type: string
                    name:
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    pullPolicy:
                      description: PullPolicy describes a policy for if/when to pull
                        a container image
                      enum:
                      - Always
                      - IfNotPresent
                      - Never
                      type: string
                    remove:
                      description: |-
                        Remove removes the named container from the pod.
                        Mutually exclusive with all other container fields.
                      type: boolean
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: remove is mutually exclusive with other container fields
                    rule: '!self.remove || (!has(self.image) && !has(self.pullPolicy)
                      && !has(self.command) && !has(self.args) && !has(self.env))'
                  - message: at least one override field must be set
                    rule: self.remove || has(self.image) || has(self.pullPolicy) ||
                      has(self.command) || has(self.args) || (has(self.env) && size(self.env)
                      > 0)
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              match:
                description: |-
                  Match selects the Pods affected by this override. The runtime selector is
                  evaluated against the admitted Pod object, not against its owning
                  Deployment, DaemonSet, Job, or Pod template.

                  All non-empty match fields must match the same Pod. A field that is absent
                  does not constrain the match, but at least one field must be non-empty.
                properties:
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels requires every key and value to be present on the Pod with the
                      same value. An empty map does not constrain labels and is not by itself
                      a valid match.
                    type: object
                  namespace:
                    description: |-
                      Namespace restricts the match to Pods in this namespace. An empty value
                      does not constrain the namespace.
                    maxLength: 63
                    type: string
                  nodeName:
                    description: |-
                      NodeName restricts the match to Pods assigned to this exact node. The
                      admission webhook observes Pods on CREATE, before the scheduler has
                      assigned a node to an ordinary Pod. This field is therefore most useful
                      for Pods created with an explicit node assignment, such as DaemonSet
                      Pods.
                    maxLength: 253
                    type: string
                  podName:
                    description: |-
                      PodName restricts the match to one exact Pod name. Generated Pod names
                      change on recreation, so labels are usually more stable for controller-
                      owned workloads.
                    maxLength: 253
                    type: string
                type: object
                x-kubernetes-validations:
                - message: at least one non-empty match field must be set
                  rule: (has(self.namespace) && size(self.namespace) > 0) || (has(self.labels)
                    && size(self.labels) > 0) || (has(self.podName) && size(self.podName)
                    > 0) || (has(self.nodeName) && size(self.nodeName) > 0)
              noOp:
                description: NoOp suppresses execution of every container in matching
                  pods.
                type: boolean
              replacePod:
                description: |-
                  ReplacePod replaces the entire Pod workload with a single container.
                  All original regular and init containers are removed.
                properties:
                  args:
                    items:
                      type: string
                    type: array
                  command:
                    items:
                      type: string
                    type: array
                  env:
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: |-
                                    The key to select from the ConfigMap's Data field.
                                    Keys in the BinaryData field are not currently propagated to container env vars.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  image:
                    minLength: 1
                    type: string
                  name:
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  pullPolicy:
                    description: PullPolicy describes a policy for if/when to pull
                      a container image
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                required:
                - image
                - name
                type: object
              serviceAccountName:
                description: |-
                  ServiceAccountName overrides the pod-level service account.
                  Composable with any mode (noOp, containers, or replacePod).
                maxLength: 253
                type: string
                x-kubernetes-validations:
                - message: serviceAccountName must be a valid DNS subdomain
                  rule: '!format.dns1123Subdomain().validate(self).hasValue()'
            required:
            - match
            type: object
            x-kubernetes-validations:
            - message: noOp, containers, and replacePod are mutually exclusive
              rule: '(self.noOp ? 1 : 0) + (has(self.containers) && size(self.containers)
                > 0 ? 1 : 0) + (has(self.replacePod) ? 1 : 0) <= 1'
            - message: one of noOp, containers, or replacePod must be set
              rule: self.noOp || (has(self.containers) && size(self.containers) >
                0) || has(self.replacePod)
          status:
            properties:
              appliedPods:
                description: |-
                  AppliedPods is the number of matched live Pods whose effective admitted
                  specification contains this override. It is a point-in-time observation.
                format: int32
                minimum: 0
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
