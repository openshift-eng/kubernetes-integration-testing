---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: resourcecollections.kit.openshift.io
spec:
  group: kit.openshift.io
  names:
    kind: ResourceCollection
    listKind: ResourceCollectionList
    plural: resourcecollections
    singular: resourcecollection
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ResourceCollection declares a set of bootstrap resources to render and apply
          to the cluster. Templates are resolved from a named source (builtin
          or filesystem) or provided inline.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              inline:
                description: |-
                  Inline provides templates directly in the CR.
                  Mutually exclusive with Source.
                items:
                  properties:
                    content:
                      type: string
                  required:
                  - content
                  type: object
                minItems: 1
                type: array
              scriptCollections:
                description: |-
                  ScriptCollections lists other ResourceCollections whose script
                  packages are merged into this collection's bundle. Dependencies
                  are resolved transitively. An Agent's entrypoint must target a
                  local package, not one from a dependency.
                items:
                  type: string
                maxItems: 32
                type: array
              scripts:
                description: |-
                  Scripts declares script packages available for Agent CRs.
                  Each package is loaded from a directory or inline content. Packages with
                  an entrypoint are runnable (Agent targets them); packages without are
                  libraries available to runnable packages via require("<package>/<file>").
                items:
                  properties:
                    capabilities:
                      description: |-
                        Capabilities declares the Kubernetes API access this package needs.
                        Kit compiles them into generated RBAC and enforces them at runtime.
                      items:
                        description: |-
                          ScriptCapability declares access to a set of Kubernetes resources.
                          It embeds rbacv1.PolicyRule so the compiler can consume it directly.
                          Fields not supported in v1 (resourceNames, nonResourceURLs) are
                          rejected by CRD validation. Semantic checks (wildcard rejection,
                          verb allowlist, empty resource) are deferred to the loader.
                        properties:
                          apiGroups:
                            description: |-
                              apiGroups is the name of the APIGroup that contains the resources.  If multiple API groups are specified, any action requested against one of
                              the enumerated resources in any API group will be allowed. "" represents the core API group and "*" represents all API groups.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          nonResourceURLs:
                            description: |-
                              nonResourceURLs is a set of partial urls that a user should have access to.  *s are allowed, but only as the full, final step in the path
                              Since non-resource URLs are not namespaced, this field is only applicable for ClusterRoles referenced from a ClusterRoleBinding.
                              Rules can either apply to API resources (such as "pods" or "secrets") or non-resource URL paths (such as "/api"),  but not both.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          resourceNames:
                            description: resourceNames is an optional white list of
                              names that the rule applies to.  An empty set means
                              that everything is allowed.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          resources:
                            description: resources is a list of resources this rule
                              applies to. '*' represents all resources.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          scope:
                            description: Scope determines where this capability applies.
                            enum:
                            - targetNamespace
                            - allNamespaces
                            - cluster
                            type: string
                          verbs:
                            description: verbs is a list of Verbs that apply to ALL
                              the ResourceKinds contained in this rule. '*' represents
                              all verbs.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - scope
                        - verbs
                        type: object
                        x-kubernetes-validations:
                        - message: at least one apiGroup is required
                          rule: size(self.apiGroups) >= 1
                        - message: at least one resource is required
                          rule: size(self.resources) >= 1
                        - message: verbs must have between 1 and 7 entries
                          rule: size(self.verbs) >= 1 && size(self.verbs) <= 7
                        - message: resourceNames is not supported
                          rule: '!has(self.resourceNames) || size(self.resourceNames)
                            == 0'
                        - message: nonResourceURLs is not supported
                          rule: '!has(self.nonResourceURLs) || size(self.nonResourceURLs)
                            == 0'
                      maxItems: 32
                      type: array
                    entrypoint:
                      description: |-
                        Entrypoint is the path to the main script file, relative to the
                        package root. Only valid with root. Packages with an entrypoint are
                        runnable (Agent CRs can reference them); packages without are
                        libraries available via require("<package-name>/<file>").
                      maxLength: 256
                      type: string
                    include:
                      description: |-
                        Include restricts which files under root are part of the package.
                        Each entry is a glob pattern matched against the relative path.
                        Supports ** for recursive matching. Only valid when root is set.
                      items:
                        type: string
                      maxItems: 32
                      type: array
                    inline:
                      description: |-
                        Inline provides the script content directly in the CR.
                        Inline packages are always runnable with the inline content as the
                        entrypoint.
                      maxLength: 1048576
                      type: string
                    name:
                      description: Name identifies this script package within the
                        collection.
                      maxLength: 63
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: name must be a valid DNS label
                        rule: '!format.dns1123Label().validate(self).hasValue()'
                    root:
                      description: |-
                        Root is a directory path relative to the collection root.
                        All files under root are included unless filtered by include globs.
                      maxLength: 256
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of root or inline must be set
                    rule: '(has(self.root) && size(self.root) > 0 ? 1 : 0) + (has(self.inline)
                      && size(self.inline) > 0 ? 1 : 0) == 1'
                  - message: include is only valid with root
                    rule: '!(has(self.include) && size(self.include) > 0) || (has(self.root)
                      && size(self.root) > 0)'
                  - message: entrypoint is only valid with root
                    rule: '!(has(self.entrypoint) && size(self.entrypoint) > 0) ||
                      (has(self.root) && size(self.root) > 0)'
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              source:
                description: |-
                  Source is the name of a builtin or filesystem-provided collection.
                  Mutually exclusive with Inline.
                minLength: 1
                type: string
              statusPatches:
                description: |-
                  StatusPatches are evaluated post-apply to set status on rendered objects.
                  Each entry targets one object by kind+name and provides a CEL expression
                  or a static map (with CEL in values) that produces the status to write.
                items:
                  description: |-
                    StatusPatch declares a status to apply to a rendered object after it has been
                    created. The Status field can be either a CEL expression string that evaluates
                    to a map, or a YAML map whose leaf values are CEL expressions.
                  properties:
                    kind:
                      description: Kind of the target object.
                      type: string
                    name:
                      description: Name of the target object.
                      type: string
                    status:
                      description: |-
                        Status is the status to set. It can be a CEL expression (string) that
                        returns a map, or a structured map with CEL expressions in leaf values.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - kind
                  - name
                  - status
                  type: object
                type: array
              values:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Values are user-defined variables accessible as {{ .Values.key }} in templates.
                  Each value can be any JSON primitive (string, number, bool, array, object).
                type: object
            type: object
            x-kubernetes-validations:
            - message: source and inline are mutually exclusive
              rule: '!(has(self.source) && has(self.inline))'
            - message: one of source, inline, scripts, or scriptCollections must be
                set
              rule: has(self.source) || has(self.inline) || (has(self.scripts) &&
                size(self.scripts) > 0) || (has(self.scriptCollections) && size(self.scriptCollections)
                > 0)
            - message: scripts with root require source
              rule: '!has(self.scripts) || !self.scripts.exists(s, has(s.root) &&
                size(s.root) > 0) || has(self.source)'
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentHash:
                description: |-
                  ContentHash is a deterministic hash of the collection's declared
                  content: rendered manifests, loaded scripts (with local package
                  membership), and status patch declarations. It does not include
                  Agent-level values, runtime, or timeout — those affect
                  BundleDigest, not ContentHash. It is written together with the
                  status conditions, and the reconciler skips the apply when it
                  already matches the rendered content of an applied collection.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
