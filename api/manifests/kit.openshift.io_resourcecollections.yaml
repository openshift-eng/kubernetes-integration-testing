---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: resourcecollections.kit.openshift.io
spec:
  group: kit.openshift.io
  names:
    kind: ResourceCollection
    listKind: ResourceCollectionList
    plural: resourcecollections
    singular: resourcecollection
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ResourceCollection declares a set of bootstrap resources to render and apply
          to the cluster. Templates are resolved from a named source (builtin
          or filesystem) or provided inline.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              inline:
                description: |-
                  Inline provides templates directly in the CR.
                  Mutually exclusive with Source.
                items:
                  properties:
                    content:
                      type: string
                  required:
                  - content
                  type: object
                minItems: 1
                type: array
              source:
                description: |-
                  Source is the name of a builtin or filesystem-provided collection.
                  Mutually exclusive with Inline.
                type: string
              statusPatches:
                description: |-
                  StatusPatches are evaluated post-apply to set status on rendered objects.
                  Each entry targets one object by kind+name and provides a CEL expression
                  or a static map (with CEL in values) that produces the status to write.
                items:
                  description: |-
                    StatusPatch declares a status to apply to a rendered object after it has been
                    created. The Status field can be either a CEL expression string that evaluates
                    to a map, or a YAML map whose leaf values are CEL expressions.
                  properties:
                    kind:
                      description: Kind of the target object.
                      type: string
                    name:
                      description: Name of the target object.
                      type: string
                    status:
                      description: |-
                        Status is the status to set. It can be a CEL expression (string) that
                        returns a map, or a structured map with CEL expressions in leaf values.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - kind
                  - name
                  - status
                  type: object
                type: array
              values:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Values are user-defined variables accessible as {{ .Values.key }} in templates.
                  Each value can be any JSON primitive (string, number, bool, array, object).
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of source or inline must be set
              rule: has(self.source) != has(self.inline)
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              contentHash:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
