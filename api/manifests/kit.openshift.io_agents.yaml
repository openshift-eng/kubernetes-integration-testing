---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agents.kit.openshift.io
spec:
  group: kit.openshift.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              runtime:
                description: Runtime selects the script engine.
                enum:
                - js
                type: string
              script:
                description: Script references a package in a ResourceCollection.
                properties:
                  collection:
                    description: Collection is the name of the cluster-scoped ResourceCollection.
                    type: string
                    x-kubernetes-validations:
                    - message: collection must be a valid DNS subdomain
                      rule: '!format.dns1123Subdomain().validate(self).hasValue()'
                  package:
                    description: Package is the name of the script package within
                      the collection.
                    type: string
                    x-kubernetes-validations:
                    - message: package must be a valid DNS label
                      rule: '!format.dns1123Label().validate(self).hasValue()'
                required:
                - collection
                - package
                type: object
              target:
                description: Target selects the pods and container to replace with
                  the agent.
                properties:
                  container:
                    description: |-
                      Container is the regular container name to replace with the agent binary.
                      Required when replace is "container", must not be set when replace is "pod".
                    type: string
                    x-kubernetes-validations:
                    - message: container must be a valid DNS label
                      rule: '!format.dns1123Label().validate(self).hasValue()'
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels restricts the match to Pods carrying every listed label with the
                      exact value. Same semantics as WorkloadOverride.
                    type: object
                  namespace:
                    description: |-
                      Namespace is the target namespace where the agent identity and generated
                      WorkloadOverride will take effect. Does not need to exist when the Agent
                      is created.
                    type: string
                    x-kubernetes-validations:
                    - message: namespace must be a valid DNS label
                      rule: '!format.dns1123Label().validate(self).hasValue()'
                  nodeName:
                    description: NodeName restricts the match to Pods assigned to
                      this node.
                    type: string
                  podName:
                    description: PodName restricts the match to one exact Pod name.
                    type: string
                  replace:
                    default: pod
                    description: |-
                      Replace selects the replacement boundary. "pod" replaces the entire Pod
                      workload with one agent container, removing all original containers.
                      "container" replaces exactly one named container and preserves the rest.
                    enum:
                    - pod
                    - container
                    type: string
                required:
                - namespace
                type: object
                x-kubernetes-validations:
                - message: target.container is required when replace is container
                  rule: self.replace != 'container' || (has(self.container) && size(self.container)
                    > 0)
                - message: target.container must not be set when replace is pod
                  rule: self.replace != 'pod' || !has(self.container) || size(self.container)
                    == 0
                - message: replace pod requires at least one selector beyond namespace
                    (labels, podName, or nodeName)
                  rule: self.replace != 'pod' || (has(self.labels) && size(self.labels)
                    > 0) || (has(self.podName) && size(self.podName) > 0) || (has(self.nodeName)
                    && size(self.nodeName) > 0)
              timeout:
                description: Timeout limits the total execution time of the agent
                  script.
                type: string
              values:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: Values are user-defined variables passed to the script
                  as ctx.values.
                type: object
            required:
            - runtime
            - script
            - target
            type: object
            x-kubernetes-validations:
            - message: timeout must be positive
              rule: '!has(self.timeout) || duration(self.timeout) > duration(''0s'')'
          status:
            properties:
              bundleDigest:
                description: BundleDigest is the SHA256 hex digest of the current
                  resolved bundle.
                pattern: ^[a-f0-9]{64}$
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
