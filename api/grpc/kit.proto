syntax = "proto3";

package kit;

option go_package = "github.com/openshift-eng/kubernetes-integration-testing/api/grpc";

service Daemon {
  rpc CreateCluster(CreateClusterRequest) returns (CreateClusterResponse);
  rpc DestroyCluster(DestroyClusterRequest) returns (DestroyClusterResponse);
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  rpc GetClusterKubeConfig(GetClusterKubeConfigRequest) returns (GetClusterKubeConfigResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message CreateClusterRequest {
  bytes manifest = 1;
  string pull_secret = 2;
  // resources are ordered single-document manifests (JSON or YAML)
  // applied to the cluster after bootstrap. They are parsed and validated
  // before the cluster is created.
  repeated bytes resources = 3;
  // wait_resources blocks until the applied resources report Ready.
  bool wait_resources = 4;
  // timeout_seconds bounds the resource apply and wait phase. Zero
  // selects the daemon default.
  int32 timeout_seconds = 5;
}

message CreateClusterResponse {
  string kubeconfig = 1;
}

message DestroyClusterRequest {
  string name = 1;
}

message DestroyClusterResponse {}

message ListClustersRequest {}

message ListClustersResponse {
  repeated string names = 1;
}

message GetClusterKubeConfigRequest {
  string name = 1;
  bool content = 2;
}

message GetClusterKubeConfigResponse {
  string path = 1;
  string content = 2;
}

message ShutdownRequest {}

message ShutdownResponse {}
